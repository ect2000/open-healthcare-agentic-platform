apiVersion: v1
kind: Service
metadata:
  name: open-healthcare-api
  namespace: open-healthcare
spec:
  type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: open-healthcare-ui
  namespace: open-healthcare
spec:
  type: NodePort
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30851
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: open-healthcare
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: open-healthcare
spec:
  type: NodePort
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: open-healthcare
spec:
  type: NodePort
  ports:
    - name: http
      port: 3200
      targetPort: 3200
      nodePort: 30200
      protocol: TCP
