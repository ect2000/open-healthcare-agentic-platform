apiVersion: v1
kind: ConfigMap
metadata:
  name: host-ollama-proxy-config
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: host-ollama-bridge
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      server {
        listen 11434;
        location / {
          proxy_pass http://host.docker.internal:11434;
          proxy_set_header Host localhost:11434;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_read_timeout 300s;
          proxy_connect_timeout 10s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-ollama-bridge
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: host-ollama-bridge
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: host-ollama-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: host-ollama-bridge
        app.kubernetes.io/part-of: open-healthcare-agentic-platform
    spec:
      containers:
        - name: nginx-proxy
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 11434
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config-volume
          configMap:
            name: host-ollama-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: host-ollama-bridge
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: host-ollama-bridge
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: host-ollama-bridge
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
