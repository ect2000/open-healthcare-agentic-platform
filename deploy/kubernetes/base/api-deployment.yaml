apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-healthcare-api
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: open-healthcare-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-healthcare-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-healthcare-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: open-healthcare-agentic-platform
    spec:
      containers:
        - name: api
          image: open-healthcare-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: healthcare-config
            - secretRef:
                name: healthcare-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "open-healthcare-api"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
