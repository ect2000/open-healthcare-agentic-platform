apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
data:
  datasources.yaml: |
    apiVersion: 1
    
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
    
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo:3200
        isDefault: false
        editable: true
        jsonData:
          httpMethod: GET
          tracesToLogs:
            datasourceUid: ""
          serviceMap:
            datasourceUid: "prometheus"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
data:
  dashboards.yaml: |
    apiVersion: 1
    
    providers:
      - name: "Healthcare Observability Dashboards"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-definitions
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
data:
  healthcare_observability.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "SECTION 1: Platform Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } },
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 1 },
          "id": 2,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Total Search Requests",
          "type": "stat",
          "targets": [
            { "expr": "sum(healthcare_search_requests_total) or vector(0)", "legendFormat": "Requests", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "reqps" } },
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 1 },
          "id": 3,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Requests Per Second",
          "type": "stat",
          "targets": [
            { "expr": "sum(rate(healthcare_search_requests_total[1m])) or vector(0)", "legendFormat": "RPS", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } } },
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 1 },
          "id": 4,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Total Search Errors",
          "type": "stat",
          "targets": [
            { "expr": "sum(healthcare_search_errors_total) or vector(0)", "legendFormat": "Errors", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 15 }, "unit": "s" } },
          "gridPos": { "h": 5, "w": 12, "x": 12, "y": 1 },
          "id": 5,
          "options": { "tooltip": { "mode": "single", "sort": "none" } },
          "title": "Platform Latency (P50, P95, P99)",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(healthcare_search_duration_seconds_bucket[5m])) by (le))", "legendFormat": "P50 Latency", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum(rate(healthcare_search_duration_seconds_bucket[5m])) by (le))", "legendFormat": "P95 Latency", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum(rate(healthcare_search_duration_seconds_bucket[5m])) by (le))", "legendFormat": "P99 Latency", "refId": "C" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "id": 6,
          "title": "SECTION 2: Agent Workflow",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20 }, "unit": "s" } },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 7 },
          "id": 7,
          "options": { "tooltip": { "mode": "multi", "sort": "desc" } },
          "title": "Agent Stage Duration (Planner, Fan-out, Retrieval, Processor, Synthesis)",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(healthcare_stage_duration_seconds_bucket[5m])) by (le, stage))", "legendFormat": "P95 {{stage}}", "refId": "A" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 8,
          "title": "SECTION 3: Retrieval Performance",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 15 },
          "id": 9,
          "options": { "tooltip": { "mode": "single", "sort": "none" } },
          "title": "Retrieval Requests by Source",
          "type": "timeseries",
          "targets": [
            { "expr": "sum(rate(healthcare_retrieval_requests_total[1m])) by (source)", "legendFormat": "{{source}} req/s", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "s" } },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 15 },
          "id": 10,
          "options": { "tooltip": { "mode": "single", "sort": "none" } },
          "title": "Source Latency (P95 by Source)",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(healthcare_retrieval_duration_seconds_bucket[5m])) by (le, source))", "legendFormat": "{{source}} P95", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 15 },
          "id": 11,
          "options": { "tooltip": { "mode": "single", "sort": "none" } },
          "title": "Retrieval Failures & MedlinePlus Fallbacks",
          "type": "timeseries",
          "targets": [
            { "expr": "sum(rate(healthcare_retrieval_errors_total[1m])) by (source)", "legendFormat": "Errors: {{source}}", "refId": "A" },
            { "expr": "sum(rate(healthcare_retrieval_timeouts_total[1m])) by (source)", "legendFormat": "Timeouts: {{source}}", "refId": "B" },
            { "expr": "sum(rate(healthcare_retrieval_fallback_total[1m])) by (source)", "legendFormat": "Fallbacks: {{source}}", "refId": "C" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 },
          "id": 12,
          "title": "SECTION 4: Evidence Quality",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 22 },
          "id": 13,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Retrieved Records",
          "type": "stat",
          "targets": [
            { "expr": "sum(healthcare_evidence_retrieved_total) or vector(0)", "legendFormat": "Total Retrieved", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 22 },
          "id": 14,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Retained Records (Grounded)",
          "type": "stat",
          "targets": [
            { "expr": "sum(healthcare_evidence_retained_total) or vector(0)", "legendFormat": "Total Retained", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 22 },
          "id": 15,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Excluded Records (Irrelevant)",
          "type": "stat",
          "targets": [
            { "expr": "sum(healthcare_evidence_excluded_total) or vector(0)", "legendFormat": "Total Excluded", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 22 },
          "id": 16,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Deduplicated Records",
          "type": "stat",
          "targets": [
            { "expr": "sum(healthcare_evidence_deduplicated_total) or vector(0)", "legendFormat": "Total Deduped", "refId": "A" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 28 },
          "id": 17,
          "title": "SECTION 5: Gemma 4 Inference",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 29 },
          "id": 18,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Inference Requests",
          "type": "stat",
          "targets": [
            { "expr": "sum(healthcare_inference_requests_total) or vector(0)", "legendFormat": "Inference Calls", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "s" } },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 29 },
          "id": 19,
          "options": { "tooltip": { "mode": "single", "sort": "none" } },
          "title": "Inference Latency (P95)",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(healthcare_inference_duration_seconds_bucket[5m])) by (le))", "legendFormat": "Inference P95", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 29 },
          "id": 20,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Prompt Tokens Processed",
          "type": "stat",
          "targets": [
            { "expr": "sum(healthcare_inference_prompt_tokens_total) or vector(0)", "legendFormat": "Prompt Tokens", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 29 },
          "id": 21,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Completion Tokens Generated",
          "type": "stat",
          "targets": [
            { "expr": "sum(healthcare_inference_completion_tokens_total) or vector(0)", "legendFormat": "Generated Tokens", "refId": "A" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 35 },
          "id": 22,
          "title": "SECTION 6: Distributed Tracing",
          "type": "row"
        },
        {
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 36 },
          "id": 23,
          "options": {},
          "title": "Tempo Trace Search & Agent Execution Timeline",
          "type": "traces",
          "targets": [
            { "datasource": { "type": "tempo", "uid": "tempo" }, "limit": 20, "query": "{service.name=\"open-healthcare-api\"}", "queryType": "traceql", "refId": "A" }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["healthcare", "agentic-ai", "opentelemetry", "m8"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Open Healthcare Agentic AI — Observability",
      "uid": "healthcare-observability",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: open-healthcare-agentic-platform
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.3.3
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: healthcare-secrets
                  key: GRAFANA_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthcare-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
          volumeMounts:
            - name: datasources-volume
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-volume
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-definitions-volume
              mountPath: /var/lib/grafana/dashboards
            - name: storage-volume
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datasources-volume
          configMap:
            name: grafana-datasources
        - name: dashboards-volume
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-definitions-volume
          configMap:
            name: grafana-dashboard-definitions
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
