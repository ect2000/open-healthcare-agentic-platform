apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s

    scrape_configs:
      - job_name: "otel-collector"
        static_configs:
          - targets: ["otel-collector:8889"]
            labels:
              service: "open-healthcare"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: open-healthcare-agentic-platform
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
