apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-healthcare-ui
  namespace: open-healthcare
  labels:
    app.kubernetes.io/name: open-healthcare-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: open-healthcare-agentic-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-healthcare-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-healthcare-ui
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: open-healthcare-agentic-platform
    spec:
      containers:
        - name: ui
          image: open-healthcare-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          envFrom:
            - configMapRef:
                name: healthcare-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "open-healthcare-ui"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
