<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#ff7676"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009688"/>
      <stop offset="100%" stop-color="#26a69a"/>
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="liveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ollamaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Title & Subtitle -->
  <text x="35" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Docker Compose Containerization Architecture (Milestone M6)</text>
  <text x="35" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Dual-Profile Execution: Native Apple Silicon Host Ollama Acceleration &amp; Full Containerized Demonstration</text>

  <!-- Node 1: Streamlit UI Container -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <rect width="180" height="235" rx="8" fill="#ffffff" stroke="#ff4b4b" stroke-width="2"/>
    <rect width="180" height="8" rx="4" fill="url(#uiGrad)"/>
    <text x="90" y="38" font-family="sans-serif" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">open-healthcare-ui</text>
    <text x="90" y="55" font-family="sans-serif" font-size="10" font-weight="600" fill="#ff4b4b" text-anchor="middle">Port 8501:8501</text>
    <text x="90" y="80" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Non-Root User (10001)</text>
    <text x="90" y="98" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Multi-Stage Slim Runner</text>
    <text x="90" y="116" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Streamlit Healthcheck</text>
    <text x="90" y="134" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">DNS: http://api:8000</text>
    <text x="90" y="152" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Preset Clinical Demos</text>
    <text x="90" y="170" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">4 Tabbed Result Cards</text>
    <text x="90" y="188" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Provenance Ledger</text>
    <text x="90" y="212" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#0284c7" text-anchor="middle">Network: healthcare-net</text>
  </g>

  <!-- Arrow: UI -> API -->
  <path d="M 210 205 L 260 205" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="195" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">HTTP</text>

  <!-- Node 2: FastAPI Gateway Container -->
  <g transform="translate(270, 95)" filter="url(#shadow)">
    <rect width="210" height="235" rx="8" fill="#ffffff" stroke="#009688" stroke-width="2"/>
    <rect width="210" height="8" rx="4" fill="url(#apiGrad)"/>
    <text x="105" y="38" font-family="sans-serif" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">open-healthcare-api</text>
    <text x="105" y="55" font-family="sans-serif" font-size="10" font-weight="600" fill="#009688" text-anchor="middle">Port 8000:8000</text>
    <text x="105" y="80" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Non-Root User (10001)</text>
    <text x="105" y="98" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Liveness /health</text>
    <text x="105" y="116" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Deep Readiness /ready</text>
    <text x="105" y="134" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">POST /api/v1/search</text>
    <text x="105" y="152" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">LangGraph Orchestrator</text>
    <text x="105" y="170" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Unified Evidence Layer</text>
    <text x="105" y="188" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Deterministic Validator</text>
    <text x="105" y="212" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#0284c7" text-anchor="middle">Network: healthcare-net</text>
  </g>

  <!-- Arrow: API -> External Sources -->
  <path d="M 480 160 L 535 160" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="507" y="150" font-family="sans-serif" font-size="8.5" fill="#047857" text-anchor="middle">HTTPS</text>

  <!-- Node 3: 4 Public Healthcare Data Sources -->
  <g transform="translate(545, 95)" filter="url(#shadow)">
    <rect width="200" height="235" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect width="200" height="8" rx="4" fill="url(#liveGrad)"/>
    <text x="100" y="38" font-family="sans-serif" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Live Public Sources</text>
    <text x="100" y="55" font-family="sans-serif" font-size="10" font-weight="600" fill="#047857" text-anchor="middle">Authoritative Federal APIs</text>
    <text x="100" y="80" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">CMS NPPES Registry v2.1</text>
    <text x="100" y="98" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">NCBI PubMed E-Utilities</text>
    <text x="100" y="116" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">CMS Provider Data Catalog</text>
    <text x="100" y="134" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">NLM MedlinePlus Web/Connect</text>
    <text x="100" y="156" font-family="sans-serif" font-size="9" fill="#047857" text-anchor="middle">✓ Bounded Retries &amp; Backoff</text>
    <text x="100" y="174" font-family="sans-serif" font-size="9" fill="#047857" text-anchor="middle">✓ Official Domain Provenance</text>
    <text x="100" y="192" font-family="sans-serif" font-size="9" fill="#047857" text-anchor="middle">✓ 12h In-Memory Cache</text>
    <text x="100" y="212" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#047857" text-anchor="middle">External Federal Ingress</text>
  </g>

  <!-- Arrow: API -> Ollama Profiles -->
  <path d="M 480 250 L 780 250" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="635" y="242" font-family="sans-serif" font-size="8.5" fill="#4338ca" text-anchor="middle">Gemma 4 Inference</text>

  <!-- Node 4: Profile A (Recommended Host Ollama) -->
  <g transform="translate(790, 95)" filter="url(#shadow)">
    <rect width="215" height="110" rx="8" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
    <rect width="215" height="8" rx="4" fill="url(#ollamaGrad)"/>
    <text x="107" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">Profile A: Host Ollama (Default)</text>
    <text x="107" y="48" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#4338ca" text-anchor="middle">host.docker.internal:11434</text>
    <text x="107" y="68" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">✓ Native Metal/GPU Acceleration</text>
    <text x="107" y="84" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">✓ Gemma 4:e2b Model Persistence</text>
    <text x="107" y="100" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#166534" text-anchor="middle">Recommended for Apple Silicon</text>
  </g>

  <!-- Node 5: Profile B (Full Containerized Ollama) -->
  <g transform="translate(790, 220)" filter="url(#shadow)">
    <rect width="215" height="110" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="215" height="8" rx="4" fill="url(#dockerGrad)"/>
    <text x="107" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">Profile B: Container Ollama</text>
    <text x="107" y="48" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#0284c7" text-anchor="middle">ollama/ollama:latest (Port 11435)</text>
    <text x="107" y="68" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">✓ Named Volume: open-healthcare-ollama-models</text>
    <text x="107" y="84" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">✓ Automated Model Bootstrapper</text>
    <text x="107" y="100" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#b45309" text-anchor="middle">CPU Inference Fallback Profile</text>
  </g>

  <!-- Footer Disclaimer -->
  <rect x="30" y="355" width="1220" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="45" y="377" font-family="sans-serif" font-size="10" font-weight="700" fill="#334155">Production Containerization &amp; Deployment Standards (M6):</text>
  <text x="45" y="396" font-family="sans-serif" font-size="9" fill="#64748b">Images run as unprivileged user 10001 (appuser). No secrets, credentials, or heavy model weights are embedded in build artifacts. Container health probes run on 10s intervals.</text>
</svg>
