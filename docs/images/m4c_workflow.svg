<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="liveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="pubmedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="valGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ansGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Title & Subtitle -->
  <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">LangGraph Live Provider, Research &amp; CMS Quality Discovery (Milestone M4C)</text>
  <text x="30" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Live NPPES v2.1 + Live PubMed E-utilities + Live CMS Provider Data Catalog (MIPS &amp; Hospital Stars) + Grounded Gemma 4</text>

  <!-- Node: User Query -->
  <g transform="translate(30, 130)" filter="url(#shadow)">
    <rect width="120" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="120" height="8" rx="4" fill="#64748b"/>
    <text x="60" y="42" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">User Query</text>
    <text x="60" y="62" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">CLI / API input</text>
    <text x="60" y="80" font-family="sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">Intent &amp; Location</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="150" y1="175" x2="185" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Planner Agent -->
  <g transform="translate(190, 115)" filter="url(#shadow)">
    <rect width="145" height="120" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="145" height="8" rx="4" fill="url(#primaryGrad)"/>
    <text x="72" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">1. Planner Agent</text>
    <text x="72" y="55" font-family="sans-serif" font-size="10" font-weight="600" fill="#3b82f6" text-anchor="middle">Gemma 4 (Ollama)</text>
    <text x="72" y="75" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Specialty &amp; Jurisdiction</text>
    <text x="72" y="92" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Refined Research Topics</text>
    <text x="72" y="110" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Structured SearchPlan</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="335" y1="175" x2="370" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Subgraph: Retrieval Agents -->
  <g transform="translate(375, 75)">
    <rect width="210" height="205" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <text x="105" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">2. Retrieval Stage (M4C Live)</text>

    <!-- Provider Box (LIVE NPPES) -->
    <rect x="10" y="28" width="190" height="40" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <rect x="10" y="28" width="190" height="5" rx="2.5" fill="url(#liveGrad)"/>
    <text x="105" y="45" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">LIVE Provider Agent</text>
    <text x="105" y="59" font-family="sans-serif" font-size="8" font-weight="600" fill="#047857" text-anchor="middle">NPPES API v2.1 (Practice Addr)</text>

    <!-- Evidence Box (LIVE PUBMED) -->
    <rect x="10" y="73" width="190" height="40" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="10" y="73" width="190" height="5" rx="2.5" fill="url(#pubmedGrad)"/>
    <text x="105" y="90" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7490" text-anchor="middle">LIVE PubMed Agent</text>
    <text x="105" y="104" font-family="sans-serif" font-size="8" font-weight="600" fill="#0891b2" text-anchor="middle">Title/Abstract Relevance Filter</text>

    <!-- Quality Box (LIVE CMS PROVIDER DATA) -->
    <rect x="10" y="118" width="190" height="48" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="10" y="118" width="190" height="5" rx="2.5" fill="url(#cmsGrad)"/>
    <text x="105" y="136" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0369a1" text-anchor="middle">LIVE CMS Quality Catalog</text>
    <text x="105" y="150" font-family="sans-serif" font-size="8" font-weight="600" fill="#0284c7" text-anchor="middle">MIPS (a174-a962) &amp; Stars (xubh-q36u)</text>
    <text x="105" y="161" font-family="sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Exact NPI &amp; Facility Joins</text>

    <!-- Patient Education (Fixtures) -->
    <rect x="10" y="172" width="190" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="105" y="187" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">MedlinePlus (M4D Simulated)</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="585" y1="175" x2="620" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Validator Component -->
  <g transform="translate(625, 115)" filter="url(#shadow)">
    <rect width="155" height="120" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect width="155" height="8" rx="4" fill="url(#valGrad)"/>
    <text x="77" y="33" font-family="sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">3. Validator</text>
    <text x="77" y="52" font-family="sans-serif" font-size="10" font-weight="600" fill="#d97706" text-anchor="middle">Deterministic Guardrails</text>
    <text x="77" y="70" font-family="sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">NPI &amp; PMID Syntactic Verif</text>
    <text x="77" y="85" font-family="sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">CMS Exact NPI Match</text>
    <text x="77" y="100" font-family="sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">Clinical Independence Rule</text>
    <text x="77" y="113" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Unmatched Isolation</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="780" y1="175" x2="815" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Answer Agent & Result -->
  <g transform="translate(820, 110)" filter="url(#shadow)">
    <rect width="135" height="130" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <rect width="135" height="8" rx="4" fill="url(#ansGrad)"/>
    <text x="67" y="33" font-family="sans-serif" font-size="13" font-weight="700" fill="#4338ca" text-anchor="middle">4. Answer Agent</text>
    <text x="67" y="52" font-family="sans-serif" font-size="10" font-weight="600" fill="#6366f1" text-anchor="middle">Gemma 4 Synthesis</text>
    <text x="67" y="72" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">Grounded Findings</text>
    <text x="67" y="88" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">NPI, PMID &amp; CMS Cites</text>
    <text x="67" y="104" font-family="sans-serif" font-size="8.5" fill="#0284c7" text-anchor="middle">Explicit Scope Notice</text>
    <text x="67" y="120" font-family="sans-serif" font-size="8.5" fill="#10b981" font-weight="600" text-anchor="middle">Validated Output</text>
  </g>

  <!-- Footer note -->
  <g transform="translate(30, 310)">
    <rect width="925" height="58" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#0369a1" font-weight="600">
      * Note: M4C integrates live clinician quality metrics and hospital star ratings from the CMS Provider Data Catalog.
    </text>
    <text x="20" y="40" font-family="sans-serif" font-size="10" fill="#0284c7">
      Exact NPI matching joins clinician records; hospital star ratings remain facility-level. Absence of CMS quality scores reflects public reporting program scope, NOT poor quality.
    </text>
    <text x="20" y="52" font-family="sans-serif" font-size="9.5" fill="#0284c7">
      Biomedical research (PubMed) and provider registry (NPPES) are live; patient education (MedlinePlus) remains simulated fixtures for M4C.
    </text>
  </g>
</svg>
