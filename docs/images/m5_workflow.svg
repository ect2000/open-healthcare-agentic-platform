<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#ff7676"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009688"/>
      <stop offset="100%" stop-color="#26a69a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="liveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="valGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ansGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Title & Subtitle -->
  <text x="35" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">FastAPI + Streamlit Web Application Architecture (Milestone M5)</text>
  <text x="35" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Interactive Streamlit UI + Async FastAPI Service Orchestrating Multi-Agent Federal Healthcare Discovery</text>

  <!-- Node: Streamlit UI -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <rect width="170" height="225" rx="8" fill="#ffffff" stroke="#ff4b4b" stroke-width="2"/>
    <rect width="170" height="8" rx="4" fill="url(#uiGrad)"/>
    <text x="85" y="38" font-family="sans-serif" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Streamlit Web UI</text>
    <text x="85" y="55" font-family="sans-serif" font-size="10" font-weight="600" fill="#ff4b4b" text-anchor="middle">Port 8501 (Interactive)</text>
    <text x="85" y="80" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Platform Control Sidebar</text>
    <text x="85" y="98" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Preset Clinical Demos</text>
    <text x="85" y="116" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Source Status Monitoring</text>
    <text x="85" y="134" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Results Tabbed View</text>
    <text x="85" y="152" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Grounded Synthesis Box</text>
    <text x="85" y="170" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Auditable Provenance</text>
    <text x="85" y="195" font-family="sans-serif" font-size="9" font-weight="600" fill="#0284c7" text-anchor="middle">HealthcareApiClient</text>
    <text x="85" y="210" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">HTTP Client / Timeouts</text>
  </g>

  <!-- Arrow 1 (UI to FastAPI) -->
  <line x1="200" y1="205" x2="235" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: FastAPI Backend Service -->
  <g transform="translate(240, 95)" filter="url(#shadow)">
    <rect width="180" height="225" rx="8" fill="#ffffff" stroke="#009688" stroke-width="2"/>
    <rect width="180" height="8" rx="4" fill="url(#apiGrad)"/>
    <text x="90" y="38" font-family="sans-serif" font-size="13" font-weight="700" fill="#004d40" text-anchor="middle">FastAPI Service</text>
    <text x="90" y="55" font-family="sans-serif" font-size="10" font-weight="600" fill="#009688" text-anchor="middle">Port 8000 (OpenAPI / docs)</text>
    <text x="90" y="80" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">GET /health (Liveness)</text>
    <text x="90" y="98" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">GET /ready (Ollama/Model)</text>
    <text x="90" y="116" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">GET /api/v1/status</text>
    <text x="90" y="134" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">POST /api/v1/search</text>
    <text x="90" y="152" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Pydantic Validation</text>
    <text x="90" y="170" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">CORS &amp; Lifespan Mgmt</text>
    <text x="90" y="195" font-family="sans-serif" font-size="9" font-weight="600" fill="#00796b" text-anchor="middle">HealthcareSearchService</text>
    <text x="90" y="210" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">LangGraph Invocation</text>
  </g>

  <!-- Arrow 2 (FastAPI to LangGraph Agents) -->
  <line x1="420" y1="205" x2="455" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Subgraph: LangGraph Multi-Agent Engine -->
  <g transform="translate(460, 80)">
    <rect width="470" height="245" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
    <text x="235" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">LangGraph Multi-Agent Workflow Engine</text>

    <!-- Node: Planner Agent -->
    <rect x="15" y="38" width="130" height="95" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="58" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Planner Agent</text>
    <text x="80" y="73" font-family="sans-serif" font-size="9" font-weight="600" fill="#3b82f6" text-anchor="middle">Gemma 4 (Ollama)</text>
    <text x="80" y="92" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Intent &amp; Specialty</text>
    <text x="80" y="106" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">SearchPlan Generation</text>

    <!-- Node: Evidence Processor -->
    <rect x="160" y="38" width="145" height="95" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <text x="232" y="58" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">Evidence Processor</text>
    <text x="232" y="73" font-family="sans-serif" font-size="9" font-weight="600" fill="#0d9488" text-anchor="middle">Unified Evidence Layer</text>
    <text x="232" y="92" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Normalization &amp; Dedup</text>
    <text x="232" y="106" font-family="sans-serif" font-size="8.5" fill="#b91c1c" text-anchor="middle">Rejects PMID 39046104</text>
    <text x="232" y="120" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Explainable Ranking</text>

    <!-- Node: Deterministic Validator -->
    <rect x="320" y="38" width="135" height="95" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="387" y="58" font-family="sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Validator</text>
    <text x="387" y="73" font-family="sans-serif" font-size="9" font-weight="600" fill="#d97706" text-anchor="middle">Deterministic Python</text>
    <text x="387" y="92" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">10-Digit NPI Format</text>
    <text x="387" y="106" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Domain &amp; Citation Check</text>
    <text x="387" y="120" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Boundary Guardrails</text>

    <!-- Node: Answer Agent -->
    <rect x="15" y="145" width="440" height="85" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="235" y="168" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#4338ca" text-anchor="middle">Answer Synthesis Agent (Gemma 4 via Ollama)</text>
    <text x="235" y="186" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Grounds synthesized narrative strictly against validated citations and audit records</text>
    <text x="235" y="202" font-family="sans-serif" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">Outputs StructuredDiscoveryResult with full provenance metadata</text>
  </g>

  <!-- Arrow 3 (LangGraph to 4 Sources) -->
  <line x1="930" y1="205" x2="965" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Subgraph: 4 Authoritative Sources -->
  <g transform="translate(970, 80)">
    <rect width="280" height="245" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="24" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">4 Authoritative Public Healthcare Sources</text>

    <!-- 1. NPPES -->
    <rect x="12" y="36" width="256" height="42" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <text x="140" y="53" font-family="sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">CMS NPPES Registry API v2.1</text>
    <text x="140" y="68" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">NPI, Practice Location, Taxonomy Codes</text>

    <!-- 2. PubMed -->
    <rect x="12" y="86" width="256" height="42" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <text x="140" y="103" font-family="sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">NCBI PubMed E-Utilities</text>
    <text x="140" y="118" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">ESearch &amp; EFetch Biomedical Research</text>

    <!-- 3. CMS -->
    <rect x="12" y="136" width="256" height="42" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <text x="140" y="153" font-family="sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">CMS Provider Data Catalog</text>
    <text x="140" y="168" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Hospital Star Ratings &amp; Clinician MIPS</text>

    <!-- 4. MedlinePlus -->
    <rect x="12" y="186" width="256" height="42" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <text x="140" y="203" font-family="sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">NLM MedlinePlus Web Service &amp; Connect</text>
    <text x="140" y="218" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Patient Literacy (English &amp; Spanish)</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(30, 340)">
    <rect width="1220" height="75" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <text x="20" y="22" font-family="sans-serif" font-size="11" fill="#0369a1" font-weight="700">
      * Note: M5 introduces a browser-based presentation layer (Streamlit) communicating over REST with a unified FastAPI backend service.
    </text>
    <text x="20" y="38" font-family="sans-serif" font-size="10" fill="#0284c7">
      • Streamlit calls real FastAPI `/api/v1/search` endpoints; all planning, retrieval, deduplication, and validation logic is shared and preserved.
    </text>
    <text x="20" y="52" font-family="sans-serif" font-size="10" fill="#0284c7">
      • Provenance and boundary guards: NPI is administrative identification; PubMed literature is general science; CMS measures are institutional scope.
    </text>
    <text x="20" y="66" font-family="sans-serif" font-size="10" fill="#0284c7">
      • Ready for local multi-user demonstrations, CNCF community workshops, and future containerization in M6.
    </text>
  </g>
</svg>
