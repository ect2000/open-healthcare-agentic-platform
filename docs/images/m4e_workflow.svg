<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="liveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="evidenceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="valGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ansGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Title & Subtitle -->
  <text x="35" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Unified Evidence Processing &amp; Multi-Source Discovery (Milestone M4E)</text>
  <text x="35" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Unified Normalization, Deterministic Deduplication, Explainable Relevance/Ranking &amp; Source Provenance across 4 Live Sources</text>

  <!-- Node: User Query -->
  <g transform="translate(30, 115)" filter="url(#shadow)">
    <rect width="125" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="125" height="8" rx="4" fill="#64748b"/>
    <text x="62" y="40" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">User Query</text>
    <text x="62" y="60" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">CLI / API input</text>
    <text x="62" y="82" font-family="sans-serif" font-size="9.5" fill="#0284c7" text-anchor="middle">Clinical Intent</text>
    <text x="62" y="100" font-family="sans-serif" font-size="9.5" fill="#0284c7" text-anchor="middle">Location / Spec</text>
    <text x="62" y="118" font-family="sans-serif" font-size="9.5" fill="#0284c7" text-anchor="middle">Research Topics</text>
    <text x="62" y="138" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Search Context</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="155" y1="192" x2="185" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Planner Agent -->
  <g transform="translate(190, 115)" filter="url(#shadow)">
    <rect width="135" height="155" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="135" height="8" rx="4" fill="url(#primaryGrad)"/>
    <text x="67" y="38" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">1. Planner Agent</text>
    <text x="67" y="56" font-family="sans-serif" font-size="10" font-weight="600" fill="#3b82f6" text-anchor="middle">Gemma 4 (Ollama)</text>
    <text x="67" y="80" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Extract Specialty</text>
    <text x="67" y="98" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">City &amp; State</text>
    <text x="67" y="116" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">PubMed Terms</text>
    <text x="67" y="134" font-family="sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Education Topics</text>
    <text x="67" y="148" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">SearchPlan</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="325" y1="192" x2="355" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Subgraph: 4-Source Live Retrieval -->
  <g transform="translate(360, 85)">
    <rect width="195" height="215" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="97" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">2. Four-Source Retrieval</text>

    <!-- NPPES Box -->
    <rect x="10" y="28" width="175" height="38" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="97" y="44" font-family="sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">NPPES Provider Registry</text>
    <text x="97" y="58" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Live API v2.1 (NPI &amp; Address)</text>

    <!-- PubMed Box -->
    <rect x="10" y="73" width="175" height="38" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="97" y="89" font-family="sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">PubMed NCBI E-Utilities</text>
    <text x="97" y="103" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">ESearch &amp; ESummary (PMIDs)</text>

    <!-- CMS Box -->
    <rect x="10" y="118" width="175" height="38" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="97" y="134" font-family="sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">CMS Provider Data Catalog</text>
    <text x="97" y="148" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Facility &amp; Clinician Metrics</text>

    <!-- MedlinePlus Box -->
    <rect x="10" y="163" width="175" height="38" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="97" y="179" font-family="sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">MedlinePlus Patient Edu</text>
    <text x="97" y="193" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Web Service &amp; Connect API</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="555" y1="192" x2="585" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Subgraph: Unified Evidence Layer -->
  <g transform="translate(590, 85)" filter="url(#shadow)">
    <rect width="195" height="215" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <rect width="195" height="8" rx="4" fill="url(#evidenceGrad)"/>
    <text x="97" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">3. Unified Evidence Layer</text>

    <!-- Step A: Normalization -->
    <rect x="10" y="32" width="175" height="38" rx="5" fill="#ffffff" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="97" y="47" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">Source Normalization</text>
    <text x="97" y="61" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Preserves typed structures</text>

    <!-- Step B: Deduplication -->
    <rect x="10" y="75" width="175" height="38" rx="5" fill="#ffffff" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="97" y="90" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">Deterministic Deduplication</text>
    <text x="97" y="104" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">NPI / PMID / Canonical URL</text>

    <!-- Step C: Relevance & Ranking -->
    <rect x="10" y="118" width="175" height="42" rx="5" fill="#ffffff" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="97" y="133" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">Relevance &amp; Ranking</text>
    <text x="97" y="147" font-family="sans-serif" font-size="8.5" fill="#b91c1c" font-weight="600" text-anchor="middle">Rejects PMID 39046104</text>
    <text x="97" y="157" font-family="sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Explainable per-source ranks</text>

    <!-- Step D: Provenance -->
    <rect x="10" y="165" width="175" height="38" rx="5" fill="#ffffff" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="97" y="180" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">Source Provenance</text>
    <text x="97" y="194" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Domain &amp; Boundary Guard</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="785" y1="192" x2="815" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Deterministic Validator -->
  <g transform="translate(820, 115)" filter="url(#shadow)">
    <rect width="150" height="155" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect width="150" height="8" rx="4" fill="url(#valGrad)"/>
    <text x="75" y="38" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">4. Deterministic Validator</text>
    <text x="75" y="56" font-family="sans-serif" font-size="10" font-weight="600" fill="#d97706" text-anchor="middle">Python Verification</text>
    <text x="75" y="80" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">NPI Format &amp; Uniqueness</text>
    <text x="75" y="98" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">Citation Integrity Check</text>
    <text x="75" y="116" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">Domain Authorization</text>
    <text x="75" y="134" font-family="sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">Boundary Enforcement</text>
    <text x="75" y="148" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Zero Hallucinated Trust</text>
  </g>

  <!-- Arrow 5 -->
  <line x1="970" y1="192" x2="1000" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Answer Agent & Synthesis -->
  <g transform="translate(1005, 115)" filter="url(#shadow)">
    <rect width="145" height="155" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <rect width="145" height="8" rx="4" fill="url(#ansGrad)"/>
    <text x="72" y="38" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#4338ca" text-anchor="middle">5. Answer Agent</text>
    <text x="72" y="56" font-family="sans-serif" font-size="10" font-weight="600" fill="#6366f1" text-anchor="middle">Gemma 4 Synthesis</text>
    <text x="72" y="80" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">Grounded Narrative</text>
    <text x="72" y="98" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">Traceable Citations</text>
    <text x="72" y="116" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">Exclusion Summaries</text>
    <text x="72" y="134" font-family="sans-serif" font-size="9" fill="#059669" font-weight="600" text-anchor="middle">Structured Output</text>
    <text x="72" y="148" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">StructuredDiscoveryResult</text>
  </g>

  <!-- Footer note -->
  <g transform="translate(30, 325)">
    <rect width="1120" height="78" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <text x="20" y="22" font-family="sans-serif" font-size="11" fill="#0369a1" font-weight="700">
      * Note: M4E establishes a unified evidence normalization, deduplication, explainable relevance/ranking, and provenance layer over all 4 sources.
    </text>
    <text x="20" y="38" font-family="sans-serif" font-size="10" fill="#0284c7">
      • Provider discovery: NPPES administrative registry (NPI does not attest to clinical quality, board certification, or state license status).
    </text>
    <text x="20" y="52" font-family="sans-serif" font-size="10" fill="#0284c7">
      • Biomedical research: PubMed (topical relevance filtering explicitly excludes unrelated studies like PMID 39046104 dementia for dental queries).
    </text>
    <text x="20" y="66" font-family="sans-serif" font-size="10" fill="#0284c7">
      • Quality &amp; Education: CMS Facility quality metrics remain isolated from individual clinician ratings; MedlinePlus provides patient literacy.
    </text>
  </g>
</svg>
