[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-healthcare-agentic-platform"
version = "0.10.0"
description = "Vendor-neutral, open-source, evidence-grounded healthcare search and agentic AI platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Open Healthcare Agentic Platform Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "streamlit>=1.33.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
]

[project.scripts]
healthcare-agents = "healthcare_agents.cli:main"
open-healthcare-agentic-platform = "healthcare_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_agents"]

[tool.hatch.build.targets.sdist]
include = ["src/healthcare_agents"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "RUF",   # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/healthcare_agents/ui/components.py" = ["E501", "RUF001"]
"src/healthcare_agents/ui/app.py" = ["E501"]
"tests/test_ui.py" = ["E501"]
"scripts/run_demo.py" = ["E501", "RUF001"]
"scripts/capture_m8_screenshots.py" = ["E501"]
"scripts/capture_m9_screenshots.py" = ["E501", "W293"]
"scripts/generate_k8s_architecture_diagram.py" = ["E501", "W293", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["healthcare_agents"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --cov=healthcare_agents --cov-report=term-missing"
markers = [
    "live: marks tests that require live external network or services",
]

[tool.coverage.run]
source = ["src/healthcare_agents"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]
