apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-healthcare.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-healthcare.api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
  selector:
    {{- include "open-healthcare.api.selectorLabels" . | nindent 4 }}
