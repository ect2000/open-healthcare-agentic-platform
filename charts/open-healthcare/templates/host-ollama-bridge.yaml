{{- if and (eq .Values.inference.mode "local-ollama") .Values.inference.localBridge.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-healthcare.fullname" . }}-ollama-proxy-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-healthcare.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference-gateway
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      server {
        listen {{ .Values.inference.localBridge.port }};
        location / {
          proxy_pass http://{{ .Values.inference.localBridge.hostTarget }};
          proxy_set_header Host localhost:{{ .Values.inference.localBridge.port }};
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_read_timeout 300s;
          proxy_connect_timeout 10s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-healthcare.fullname" . }}-ollama-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-healthcare.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "open-healthcare.name" . }}-ollama-bridge
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "open-healthcare.name" . }}-ollama-bridge
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: inference-gateway
    spec:
      containers:
        - name: nginx-proxy
          image: "{{ .Values.inference.localBridge.image.repository }}:{{ .Values.inference.localBridge.image.tag }}"
          imagePullPolicy: {{ .Values.inference.localBridge.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.inference.localBridge.port }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            {{- toYaml .Values.inference.localBridge.resources | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "open-healthcare.fullname" . }}-ollama-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-healthcare.fullname" . }}-ollama-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-healthcare.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.inference.localBridge.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "open-healthcare.name" . }}-ollama-bridge
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
